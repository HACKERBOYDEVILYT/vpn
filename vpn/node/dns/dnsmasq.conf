# NexaVPN DNS resolver configuration
# This resolver is intended to run on a VPN node.

port=53
listen-address=10.0.0.1
bind-interfaces

# Never read /etc/resolv.conf
no-resolv

# Upstream resolvers
server=1.1.1.1
server=1.0.0.1

# Cache
cache-size=10000

# Do not expose resolver version
no-ident
no-hosts

# Keep DNS queries local to the VPN interface
interface=wg0

# Ignore queries for private reverse zones
local=/10.in-addr.arpa/
local=/16.172.in-addr.arpa/
local=/168.192.in-addr.arpa/

# Security / reliability
domain-needed
bogus-priv
stop-dns-rebind

# Do not forward malformed/private hostnames upstream
filterwin2k
